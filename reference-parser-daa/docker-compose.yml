networks:
  app_network:
    external: false
    name: ${NETWORK_NAME:-parser_network}

services:
  web:
    profiles: ["web"]
    build: .
    container_name: ${CONTAINER_PREFIX:-parser}_core
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - TZ=${TZ:-UTC}
      - WEBSITE_URL=${WEBSITE_URL:-https://example.com}
    command: python manage.py runserver --insecure 0.0.0.0:8000
    restart: "no"
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  db:
    image: postgres:17
    container_name: ${CONTAINER_PREFIX:-parser}_postgres
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  bot:
    build:
      context: .
    container_name: ${CONTAINER_PREFIX:-parser}_telegram_bot
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - TZ=${TZ:-UTC}
      - WEBSITE_URL=${WEBSITE_URL:-https://example.com}
    command: python bot/tg_bot.py
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 0.8G

  chrome_driver:
    image: selenium/standalone-chrome:latest
    container_name: ${CONTAINER_PREFIX:-parser}_chrome_driver
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:7900:7900"
    environment:
      - SE_NODE_MAX_INSTANCES=3
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - TZ=${TZ:-UTC}
    volumes:
      - avito_browser_profile:/home/seluser/avito-profile
    shm_size: 6gb
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  avito_proxy:
    profiles: ["avito-proxy"]
    image: ghcr.io/sagernet/sing-box:v1.14.2@sha256:afbffd294c5eb3519cc7b4587299ef189bb0a2ca2f667cb6301fdb6b9bce9558
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      - ./runtime/sessions/avito-proxy.json:/etc/sing-box/config.json:ro
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  parsers:
    build:
      context: .
    container_name: ${CONTAINER_PREFIX:-parser}_parsers
    depends_on:
      chrome_driver:
        condition: service_started
      db:
        condition: service_healthy
      avito_proxy:
        condition: service_started
        required: false
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
      - SELENIUM_URL=http://chrome_driver:4444/wd/hub
    command: python -u -m parsers.collector
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  avito_browser_profile:
  postgres_data:
